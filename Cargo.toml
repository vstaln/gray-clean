[package]
name = "gray-clean"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Sweep ephemeral session junk (spill/tmp) older than a max age at turn end. Port of hermes disk-cleanup."

[[bin]]
name = "gray-clean"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
